<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="brainGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#0077ff"/>
    </linearGradient>
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background disc for clarity in any browser theme -->
  <rect width="64" height="64" rx="14" fill="#080b14"/>
  <rect width="64" height="64" rx="14" fill="none" stroke="url(#brainGlow)" stroke-width="1.5" opacity="0.4"/>

  <!-- Stylized Cyan Brain with neural circuits -->
  <g filter="url(#neon)" stroke="url(#brainGlow)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left Hemisphere -->
    <path d="M 30 14 
             C 24 13, 14 17, 14 26 
             C 14 31, 17 34, 16 38 
             C 15 42, 18 48, 24 50 
             C 27 51, 30 49, 30 46" 
          stroke-width="2.6" />
    
    <!-- Left inner gyri / circuits -->
    <path d="M 23 20 C 26 23, 27 28, 24 32 C 20 35, 20 41, 27 43" stroke-width="2.2" opacity="0.9" />
    <path d="M 16 29 C 20 30, 22 34, 21 37" stroke-width="2" opacity="0.75" />

    <!-- Right Hemisphere -->
    <path d="M 34 14 
             C 40 13, 50 17, 50 26 
             C 50 31, 47 34, 48 38 
             C 49 42, 46 48, 40 50 
             C 37 51, 34 49, 34 46" 
          stroke-width="2.6" />

    <!-- Right inner gyri / circuits -->
    <path d="M 41 20 C 38 23, 37 28, 40 32 C 44 35, 44 41, 37 43" stroke-width="2.2" opacity="0.9" />
    <path d="M 48 29 C 44 30, 42 34, 43 37" stroke-width="2" opacity="0.75" />

    <!-- Central stem / fissure -->
    <line x1="32" y1="16" x2="32" y2="48" stroke-width="1.8" stroke-dasharray="2 3" opacity="0.7" />
  </g>

  <!-- Glowing Neural Synapse Nodes -->
  <g fill="#00f2fe">
    <circle cx="23" cy="20" r="1.8" />
    <circle cx="41" cy="20" r="1.8" />
    <circle cx="27" cy="43" r="1.8" />
    <circle cx="37" cy="43" r="1.8" />
    <circle cx="16" cy="38" r="1.6" />
    <circle cx="48" cy="38" r="1.6" />
    <circle cx="32" cy="15" r="2.2" fill="#fff" />
  </g>
</svg>
